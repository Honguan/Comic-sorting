name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install build tool
        run: python -m pip install -r requirements.txt pyinstaller==6.22.2
      - name: Test
        run: python -B -m unittest discover -s tests -v
      - name: Build
        run: python -m PyInstaller --clean --noconfirm "Comic sorting.spec"
